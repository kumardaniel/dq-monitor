name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  migrations-postgres:
    # Proves the Alembic migrations apply cleanly to a real PostgreSQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dq
          POSTGRES_PASSWORD: dq
          POSTGRES_DB: dq_monitor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dq" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dq:dq@localhost:5432/dq_monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  e2e-docker:
    # Boots the real stack (Postgres + Redis + API + Celery worker + beat), seeds the
    # demo warehouse and checks that a run completes on a background worker.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d postgres redis migrate api worker beat
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8000/ready && exit 0; sleep 2; done
          docker compose logs; exit 1
      - run: pip install httpx
      - name: Seed demo and run checks
        run: |
          python scripts/seed_demo.py --source-type postgresql \
            --source-url postgresql://dq_reader:dq_reader@postgres:5432/warehouse | tee out.txt
          grep -q "Run 1: completed" out.txt
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
