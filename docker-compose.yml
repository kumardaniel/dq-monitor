# Full local stack:  docker compose up --build
#   API        http://localhost:8000/docs
#   Prometheus http://localhost:9090
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://dq:dq@postgres:5432/dq_monitor
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CELERY_TASK_ALWAYS_EAGER: "false"
    API_KEY: ${API_KEY:-dev-api-key}
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    SCHEDULER_TICK_SECONDS: "30"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates a second database "warehouse" with demo data to monitor.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq_monitor"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    # Thread pool: checks mostly wait on the monitored database (I/O bound).
    command: celery -A app.worker.celery_app worker --loglevel=INFO --pool=threads --concurrency=4
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    command: celery -A app.worker.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [api, worker]

volumes:
  pgdata:
